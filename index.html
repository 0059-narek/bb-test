<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Stripo New Plugin v2</title>

  <script
    id="UiEditorScript"
    type="module"
    src="https://plugins.stripo.email/resources/uieditor/latest/UIEditor.js"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
    }

    #toolbar {
      height: 58px;
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      z-index: 10;
    }

    #toolbar button {
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 6px;
      padding: 8px 13px;
      cursor: pointer;
      font-size: 14px;
    }

    #toolbar button:hover {
      background: #f2f2f2;
    }

    #toolbar button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #status {
      margin-left: auto;
      font-size: 13px;
      color: #666;
      white-space: nowrap;
    }

    #stripo-editor {
      flex: 1;
      min-height: 0;
      width: 100%;
      position: relative;
    }

    #errorBox {
      display: none;
      position: fixed;
      left: 20px;
      right: 20px;
      bottom: 20px;
      z-index: 9999;
      padding: 15px;
      border-radius: 8px;
      background: #fff0f0;
      border: 1px solid #d33;
      color: #900;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      max-height: 40vh;
      overflow: auto;
    }

    #codeModal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0, 0, 0, .55);
      align-items: center;
      justify-content: center;
    }

    #codeModalContent {
      width: min(1100px, 94vw);
      height: min(750px, 90vh);
      background: #fff;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #codeModalHeader {
      height: 52px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid #ddd;
    }

    #codeOutput {
      flex: 1;
      width: 100%;
      resize: none;
      border: 0;
      outline: 0;
      padding: 15px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    .modalButtons {
      display: flex;
      gap: 8px;
    }

    .modalButtons button {
      padding: 7px 12px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="app">

  <div id="toolbar">

    <button id="btnGetHtml">
      Get HTML/CSS
    </button>

    <button id="btnCompile">
      Compile Email
    </button>

    <button id="btnSaveLocal">
      Save Local
    </button>

    <button id="btnDownload">
      Download HTML
    </button>

    <button id="btnClear">
      New Email
    </button>

    <div id="status">
      Initializing...
    </div>

  </div>

  <div id="stripo-editor"></div>

</div>

<div id="errorBox"></div>

<div id="codeModal">

  <div id="codeModalContent">

    <div id="codeModalHeader">

      <strong id="codeModalTitle">
        HTML
      </strong>

      <div class="modalButtons">

        <button id="btnCopy">
          Copy
        </button>

        <button id="btnCloseModal">
          Close
        </button>

      </div>

    </div>

    <textarea
      id="codeOutput"
      spellcheck="false"
    ></textarea>

  </div>

</div>

<script>
"use strict";

/*
|--------------------------------------------------------------------------
| STRIPO CONFIGURATION
|--------------------------------------------------------------------------
|
| Replace ONLY these placeholders with your own Stripo application values.
|
*/

const STRIPO_CONFIG = {
  pluginId: "d326e98a6b764852ab08f662c5b036b1",
  secretKey: "c10bc09bee04426a9eec888a18e629a8",

  /*
   * This is your application-side user identifier.
   * It does NOT have to be an email address.
   */
  userId: "1",

  /*
   * Supported roles according to Stripo:
   * admin
   * user
   */
  role: "user"
};


/*
|--------------------------------------------------------------------------
| Initial email
|--------------------------------------------------------------------------
*/

const INITIAL_HTML = `
<table
  width="100%"
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="background:#ffffff;"
>
  <tr>
    <td
      align="center"
      style="padding:40px 20px;"
    >

      <h1
        style="
          margin:0 0 20px 0;
          font-family:Arial,sans-serif;
          font-size:32px;
          line-height:1.2;
          color:#222222;
        "
      >
        Welcome
      </h1>

      <p
        style="
          margin:0;
          font-family:Arial,sans-serif;
          font-size:16px;
          line-height:1.6;
          color:#555555;
        "
      >
        Start creating your email with Stripo.
      </p>

    </td>
  </tr>
</table>
`;

const INITIAL_CSS = `
body {
  margin: 0;
  padding: 0;
}
`;


/*
|--------------------------------------------------------------------------
| Application state
|--------------------------------------------------------------------------
*/

let stripoEditor = null;
let currentCompiledHtml = "";
let currentTemplateData = null;


/*
|--------------------------------------------------------------------------
| DOM helpers
|--------------------------------------------------------------------------
*/

const editorContainer =
  document.getElementById("stripo-editor");

const statusElement =
  document.getElementById("status");

const errorBox =
  document.getElementById("errorBox");

const codeModal =
  document.getElementById("codeModal");

const codeOutput =
  document.getElementById("codeOutput");

const codeModalTitle =
  document.getElementById("codeModalTitle");


function setStatus(message) {
  statusElement.textContent = message;
}


function showError(error) {

  console.error(error);

  let message = "";

  if (error instanceof Error) {
    message = error.stack || error.message;
  } else if (typeof error === "string") {
    message = error;
  } else {
    try {
      message = JSON.stringify(
        error,
        null,
        2
      );
    } catch (_) {
      message = String(error);
    }
  }

  errorBox.textContent = message;
  errorBox.style.display = "block";

  setStatus("Error");
}


function hideError() {
  errorBox.style.display = "none";
}


/*
|--------------------------------------------------------------------------
| Wait for Stripo UIEditor
|--------------------------------------------------------------------------
*/

function waitForUIEditor(timeout = 30000) {

  return new Promise((resolve, reject) => {

    const started = Date.now();

    const timer = setInterval(() => {

      if (
        window.UIEditor &&
        typeof window.UIEditor.initEditor === "function"
      ) {

        clearInterval(timer);
        resolve(window.UIEditor);
        return;
      }

      if (Date.now() - started > timeout) {

        clearInterval(timer);

        reject(
          new Error(
            "Stripo UIEditor did not load within 30 seconds."
          )
        );

      }

    }, 100);

  });
}


/*
|--------------------------------------------------------------------------
| HTML-only authentication
|--------------------------------------------------------------------------
|
| IMPORTANT:
|
| Stripo officially recommends obtaining this token through
| your Customer Application Backend.
|
| This function is intentionally browser-side because this
| implementation is HTML-only.
|
*/

async function requestStripoToken() {

  if (
    !STRIPO_CONFIG.pluginId ||
    STRIPO_CONFIG.pluginId === "PUT_YOUR_PLUGIN_ID_HERE"
  ) {

    throw new Error(
      "STRIPO_CONFIG.pluginId is not configured."
    );

  }

  if (
    !STRIPO_CONFIG.secretKey ||
    STRIPO_CONFIG.secretKey === "PUT_YOUR_SECRET_KEY_HERE"
  ) {

    throw new Error(
      "STRIPO_CONFIG.secretKey is not configured."
    );

  }

  const requestBody = {

    pluginId:
      STRIPO_CONFIG.pluginId,

    secretKey:
      STRIPO_CONFIG.secretKey,

    userId:
      String(STRIPO_CONFIG.userId),

    role:
      STRIPO_CONFIG.role

  };


  const response = await fetch(
    "https://plugins.stripo.email/api/v1/auth",
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },

      body: JSON.stringify(requestBody)
    }
  );


  const rawText =
    await response.text();


  let data = null;

  try {
    data = rawText
      ? JSON.parse(rawText)
      : null;
  } catch (_) {
    data = null;
  }


  if (!response.ok) {

    throw new Error(
      "Stripo authentication failed.\n\n" +
      "HTTP status: " +
      response.status +
      "\n\n" +
      "Response:\n" +
      rawText
    );

  }


  if (
    !data ||
    typeof data.token !== "string" ||
    !data.token
  ) {

    throw new Error(
      "Stripo authentication response did not contain a token.\n\n" +
      rawText
    );

  }


  return data.token;
}


/*
|--------------------------------------------------------------------------
| Token callback
|--------------------------------------------------------------------------
*/

function onTokenRefreshRequest(callback) {

  requestStripoToken()
    .then(token => {

      callback(token);

    })
    .catch(error => {

      showError(error);

    });

}


/*
|--------------------------------------------------------------------------
| Normalize API result
|--------------------------------------------------------------------------
*/

function normalizeTemplateData(data) {

  if (!data) {
    return {
      html: "",
      css: "",
      raw: data
    };
  }


  if (typeof data === "string") {

    return {
      html: data,
      css: "",
      raw: data
    };

  }


  return {

    html:
      data.html ||
      data.HTML ||
      data.body ||
      "",

    css:
      data.css ||
      data.CSS ||
      "",

    raw:
      data

  };

}


/*
|--------------------------------------------------------------------------
| Get editable HTML/CSS
|--------------------------------------------------------------------------
*/

async function getTemplateData() {

  hideError();

  if (!stripoEditor) {

    throw new Error(
      "Stripo editor is not initialized."
    );

  }


  /*
   * Prefer the API exposed by the editor instance.
   */

  if (
    typeof stripoEditor.getTemplateData === "function"
  ) {

    return await stripoEditor.getTemplateData();

  }


  /*
   * Some integrations expose the API differently.
   * Try the global UIEditor object as a fallback.
   */

  if (
    window.UIEditor &&
    typeof window.UIEditor.getTemplateData === "function"
  ) {

    return await window.UIEditor.getTemplateData();

  }


  throw new Error(
    "getTemplateData() is not available on the current Stripo Plugin v2 instance."
  );

}


/*
|--------------------------------------------------------------------------
| Compile email
|--------------------------------------------------------------------------
*/

async function compileEmail() {

  hideError();

  if (!stripoEditor) {

    throw new Error(
      "Stripo editor is not initialized."
    );

  }


  if (
    typeof stripoEditor.compileEmail === "function"
  ) {

    return await stripoEditor.compileEmail();

  }


  if (
    window.UIEditor &&
    typeof window.UIEditor.compileEmail === "function"
  ) {

    return await window.UIEditor.compileEmail();

  }


  throw new Error(
    "compileEmail() is not available on the current Stripo Plugin v2 instance."
  );

}


/*
|--------------------------------------------------------------------------
| Extract compiled HTML
|--------------------------------------------------------------------------
*/

function extractCompiledHtml(result) {

  if (!result) {
    return "";
  }


  if (typeof result === "string") {
    return result;
  }


  if (typeof result.html === "string") {
    return result.html;
  }


  if (typeof result.HTML === "string") {
    return result.HTML;
  }


  if (typeof result.body === "string") {
    return result.body;
  }


  if (
    result.email &&
    typeof result.email.html === "string"
  ) {
    return result.email.html;
  }


  return "";
}


/*
|--------------------------------------------------------------------------
| Modal
|--------------------------------------------------------------------------
*/

function openCodeModal(title, value) {

  codeModalTitle.textContent = title;

  codeOutput.value =
    typeof value === "string"
      ? value
      : JSON.stringify(value, null, 2);

  codeModal.style.display = "flex";
}


function closeCodeModal() {
  codeModal.style.display = "none";
}


/*
|--------------------------------------------------------------------------
| Get HTML/CSS button
|--------------------------------------------------------------------------
*/

async function handleGetHtml() {

  try {

    setStatus("Reading template...");

    const data =
      await getTemplateData();

    const normalized =
      normalizeTemplateData(data);

    currentTemplateData =
      normalized;

    const output =
      [
        "<!-- HTML -->",
        normalized.html || "",
        "",
        "<!-- CSS -->",
        "<style>",
        normalized.css || "",
        "</style>"
      ].join("\n");


    openCodeModal(
      "Editable HTML / CSS",
      output
    );

    setStatus("HTML/CSS ready");

  } catch (error) {

    showError(error);

  }

}


/*
|--------------------------------------------------------------------------
| Compile button
|--------------------------------------------------------------------------
*/

async function handleCompile() {

  try {

    setStatus("Compiling...");

    const result =
      await compileEmail();

    currentCompiledHtml =
      extractCompiledHtml(result);


    if (!currentCompiledHtml) {

      openCodeModal(
        "Compile result",
        result
      );

    } else {

      openCodeModal(
        "Compiled HTML",
        currentCompiledHtml
      );

    }


    setStatus("Compiled");

  } catch (error) {

    showError(error);

  }

}


/*
|--------------------------------------------------------------------------
| Local save
|--------------------------------------------------------------------------
|
| This is browser localStorage only.
| It is NOT Stripo Autosave.
|
*/

async function handleSaveLocal() {

  try {

    setStatus("Saving locally...");

    const data =
      await getTemplateData();

    const normalized =
      normalizeTemplateData(data);

    const payload = {

      savedAt:
        new Date().toISOString(),

      html:
        normalized.html,

      css:
        normalized.css

    };


    localStorage.setItem(
      "stripo_local_template",
      JSON.stringify(payload)
    );


    currentTemplateData =
      normalized;


    setStatus("Saved locally");

  } catch (error) {

    showError(error);

  }

}


/*
|--------------------------------------------------------------------------
| Download compiled HTML
|--------------------------------------------------------------------------
*/

async function handleDownload() {

  try {

    setStatus("Compiling for download...");

    const result =
      await compileEmail();

    const html =
      extractCompiledHtml(result);


    if (!html) {

      throw new Error(
        "compileEmail() did not return HTML."
      );

    }


    currentCompiledHtml =
      html;


    const blob =
      new Blob(
        [html],
        {
          type: "text/html;charset=utf-8"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");

    link.href = url;

    link.download =
      "stripo-email.html";

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);


    setStatus("Downloaded");

  } catch (error) {

    showError(error);

  }

}


/*
|--------------------------------------------------------------------------
| New email
|--------------------------------------------------------------------------
*/

function handleClear() {

  const confirmed =
    window.confirm(
      "Create a new empty email?"
    );

  if (!confirmed) {
    return;
  }


  /*
   * The safest HTML-only way to create a fresh editor
   * is to reload the page with the initial template.
   */

  localStorage.removeItem(
    "stripo_local_template"
  );

  window.location.reload();

}


/*
|--------------------------------------------------------------------------
| Copy
|--------------------------------------------------------------------------
*/

async function handleCopy() {

  try {

    await navigator.clipboard.writeText(
      codeOutput.value
    );

    setStatus("Copied");

  } catch (error) {

    codeOutput.select();

    document.execCommand("copy");

    setStatus("Copied");

  }

}


/*
|--------------------------------------------------------------------------
| Editor initialization
|--------------------------------------------------------------------------
*/

async function initEditor() {

  try {

    hideError();

    setStatus("Loading Stripo...");


    await waitForUIEditor();


    setStatus("Requesting authentication token...");


    /*
     * Token callback follows the official New Plugin
     * authentication pattern.
     */

    const stripoConfig = {

      locale: "en",

      metadata: {

        emailId:
          "html-only-email-1",

        userId:
          String(STRIPO_CONFIG.userId)

      },


      html:
        INITIAL_HTML,

      css:
        INITIAL_CSS,


      /*
       * Free-plan compatible font-size configuration.
       */

      editorFontSizes: {

        showDefaultStandardFontsSizes:
          true,

        showDefaultNotStandardFontsSizes:
          true,

        customFontsSizes:
          [12, 14, 16, 18, 20, 24, 28, 32, 36, 48]

      },


      /*
       * Free-plan compatible custom palette.
       */

      customColorPalette:
        true,

      customColorPaletteColors: [
        "#000000",
        "#FFFFFF",
        "#333333",
        "#666666",
        "#999999",
        "#CCCCCC",
        "#FF0000",
        "#00AA00",
        "#0000FF",
        "#FF9900"
      ],

      customColorPaletteLabel:
        "Custom colors",


      /*
       * Editor panel layout.
       */

      panelPosition:
        "BLOCKS_SETTINGS",


      /*
       * Official authentication callback.
       */

      onTokenRefreshRequest:
        onTokenRefreshRequest

    };


    setStatus("Initializing editor...");


    /*
     * New Plugin v2 initialization.
     */

    stripoEditor =
      window.UIEditor.initEditor(
        editorContainer,
        stripoConfig
      );


    setStatus("Editor initialized");


  } catch (error) {

    showError(error);

  }

}


/*
|--------------------------------------------------------------------------
| Event handlers
|--------------------------------------------------------------------------
*/

document
  .getElementById("btnGetHtml")
  .addEventListener(
    "click",
    handleGetHtml
  );


document
  .getElementById("btnCompile")
  .addEventListener(
    "click",
    handleCompile
  );


document
  .getElementById("btnSaveLocal")
  .addEventListener(
    "click",
    handleSaveLocal
  );


document
  .getElementById("btnDownload")
  .addEventListener(
    "click",
    handleDownload
  );


document
  .getElementById("btnClear")
  .addEventListener(
    "click",
    handleClear
  );


document
  .getElementById("btnCopy")
  .addEventListener(
    "click",
    handleCopy
  );


document
  .getElementById("btnCloseModal")
  .addEventListener(
    "click",
    closeCodeModal
  );


codeModal.addEventListener(
  "click",
  event => {

    if (event.target === codeModal) {
      closeCodeModal();
    }

  }
);


/*
|--------------------------------------------------------------------------
| Start
|--------------------------------------------------------------------------
*/

window.addEventListener(
  "DOMContentLoaded",
  () => {
    initEditor();
  }
);

</script>

</body>
</html>
