<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Stripo Free Plugin Editor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
    }

    #app {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    #toolbar {
      height: 58px;
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      z-index: 1000;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar-center {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      border: 1px solid #d7dbe0;
      background: #fff;
      border-radius: 6px;
      padding: 7px 11px;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover {
      background: #f1f3f5;
    }

    button.primary {
      background: #111827;
      border-color: #111827;
      color: #fff;
    }

    button.primary:hover {
      background: #1f2937;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .device-button.active {
      background: #e9ecef;
    }

    /* =========================================================
       EDITOR
       ========================================================= */

    #editor-wrapper {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    #stripo-editor {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* =========================================================
       LOADING
       ========================================================= */

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.96);
      z-index: 2000;
      font-size: 15px;
    }

    #loading.hidden {
      display: none;
    }

    /* =========================================================
       ERROR
       ========================================================= */

    #error {
      position: fixed;
      left: 20px;
      right: 20px;
      bottom: 20px;
      padding: 14px 16px;
      background: #b91c1c;
      color: white;
      border-radius: 8px;
      display: none;
      z-index: 5000;
      white-space: pre-wrap;
      font-size: 13px;
    }

    #error.visible {
      display: block;
    }

    /* =========================================================
       MODAL
       ========================================================= */

    #code-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.55);
      z-index: 4000;
    }

    #code-modal.visible {
      display: flex;
    }

    .modal {
      width: min(1100px, 94vw);
      height: min(750px, 90vh);
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid #ddd;
    }

    .modal-body {
      flex: 1;
      min-height: 0;
      padding: 12px;
    }

    #html-output {
      width: 100%;
      height: 100%;
      resize: none;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.5;
    }

    /* =========================================================
       STATUS
       ========================================================= */

    #status {
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>

<body>

<div id="app">

  <!-- =======================================================
       TOOLBAR
       ======================================================== -->

  <div id="toolbar">

    <div class="toolbar-left">

      <button id="undoButton" title="Undo">
        ↶
      </button>

      <button id="redoButton" title="Redo">
        ↷
      </button>

      <button
        id="desktopButton"
        class="device-button active"
      >
        Desktop
      </button>

      <button
        id="mobileButton"
        class="device-button"
      >
        Mobile
      </button>

    </div>

    <div class="toolbar-center">

      <span id="status">
        Initializing Stripo...
      </span>

    </div>

    <div class="toolbar-right">

      <button id="codeButton">
        HTML
      </button>

      <button id="getTemplateButton">
        Get HTML
      </button>

      <button id="compileButton">
        Compile
      </button>

      <button
        id="saveButton"
        class="primary"
      >
        Save
      </button>

    </div>

  </div>


  <!-- =======================================================
       EDITOR
       ======================================================== -->

  <div id="editor-wrapper">

    <div id="stripo-editor"></div>

    <div id="loading">
      Loading Stripo editor...
    </div>

  </div>

</div>


<!-- =========================================================
     ERROR
     ========================================================== -->

<div id="error"></div>


<!-- =========================================================
     HTML MODAL
     ========================================================== -->

<div id="code-modal">

  <div class="modal">

    <div class="modal-header">

      <strong>
        Email HTML
      </strong>

      <button id="closeCodeButton">
        Close
      </button>

    </div>

    <div class="modal-body">

      <textarea
        id="html-output"
        spellcheck="false"
      ></textarea>

    </div>

  </div>

</div>


<script type="module">

  /* =========================================================
     STRIPO CREDENTIALS
     =========================================================

     PUT YOUR VALUES HERE.

     DO NOT PUBLISH THIS FILE WITH A REAL SECRET KEY.
     Browser-side JavaScript exposes the secret to the client.
     ========================================================= */

  const STRIPO_CONFIG = {

    pluginId: "PUT_YOUR_PLUGIN_ID_HERE",

    secretKey: "PUT_YOUR_SECRET_KEY_HERE",

    /*
     * Stripo role.
     *
     * Available Plugin roles are handled by Stripo.
     * USER is the normal editor role.
     */
    userId: "demo-user-1",

    /*
     * Your application-level user identifier.
     *
     * This is YOUR identifier for the person using the editor.
     * Do not put passwords here.
     */
    role: "user",

  };


  /* =========================================================
     GLOBAL STATE
     ========================================================= */

  let stripoEditor = null;

  let currentToken = null;

  let tokenExpiresAt = 0;

  let currentHtml = "";

  let currentCss = "";

  let editorReady = false;


  /* =========================================================
     DOM
     ========================================================= */

  const loadingElement =
    document.getElementById("loading");

  const errorElement =
    document.getElementById("error");

  const statusElement =
    document.getElementById("status");

  const codeModal =
    document.getElementById("code-modal");

  const htmlOutput =
    document.getElementById("html-output");


  /* =========================================================
     ERROR HANDLING
     ========================================================= */

  function showError(message) {

    console.error(message);

    errorElement.textContent = message;

    errorElement.classList.add("visible");

    statusElement.textContent = "Error";

  }


  function clearError() {

    errorElement.textContent = "";

    errorElement.classList.remove("visible");

  }


  /* =========================================================
     STATUS
     ========================================================= */

  function setStatus(message) {

    statusElement.textContent = message;

  }


  /* =========================================================
     DEMO EMAIL
     ========================================================= */

  function getInitialTemplate() {

    return {
      html: `
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Stripo Email</title>
</head>

<body style="margin:0;padding:0;background:#f4f4f4;">

  <table
    width="100%"
    cellpadding="0"
    cellspacing="0"
    border="0"
    style="background:#f4f4f4;"
  >

    <tr>

      <td align="center">

        <table
          width="600"
          cellpadding="0"
          cellspacing="0"
          border="0"
          style="
            width:600px;
            max-width:100%;
            background:#ffffff;
          "
        >

          <tr>

            <td
              style="
                padding:40px;
                font-family:Arial,sans-serif;
                text-align:center;
              "
            >

              <h1>
                Welcome to Stripo
              </h1>

              <p>
                Start editing this email with the
                Stripo editor.
              </p>

              <p>
                This template is intentionally simple
                so the editor can load it immediately.
              </p>

            </td>

          </tr>

        </table>

      </td>

    </tr>

  </table>

</body>
</html>
      `.trim(),

      css: ""
    };

  }


  /* =========================================================
     STRIPO AUTHENTICATION
     =========================================================

     Stripo documentation uses:

       POST
       https://plugins.stripo.email/api/v1/auth

     with pluginId / secretKey / role.

     The returned token is then supplied to the Plugin.
     ========================================================= */

  async function requestStripoToken() {

    if (
      !STRIPO_CONFIG.pluginId ||
      STRIPO_CONFIG.pluginId ===
        "d326e98a6b764852ab08f662c5b036b1"
    ) {

      throw new Error(
        "STRIPO_CONFIG.pluginId is not configured."
      );

    }

    if (
      !STRIPO_CONFIG.secretKey ||
      STRIPO_CONFIG.secretKey ===
        "c10bc09bee04426a9eec888a18e629a8"
    ) {

      throw new Error(
        "STRIPO_CONFIG.secretKey is not configured."
      );

    }


    const response = await fetch(
      "https://plugins.stripo.email/api/v1/auth",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          pluginId:
            STRIPO_CONFIG.pluginId,

          secretKey:
            STRIPO_CONFIG.secretKey,

          role:
            STRIPO_CONFIG.role

        })
      }
    );


    if (!response.ok) {

      const body =
        await response.text();

      throw new Error(
        "Stripo authentication failed: " +
        response.status +
        "\n" +
        body
      );

    }


    const data =
      await response.json();


    if (!data.token) {

      throw new Error(
        "Stripo authentication response did not contain a token."
      );

    }


    currentToken =
      data.token;


    /*
     * The exact expiration period can vary.
     * Keep a short local lifetime and refresh when needed.
     */
    tokenExpiresAt =
      Date.now() + (45 * 60 * 1000);


    return currentToken;

  }


  async function getValidStripoToken() {

    if (
      currentToken &&
      Date.now() < tokenExpiresAt
    ) {

      return currentToken;

    }


    return await requestStripoToken();

  }


  /* =========================================================
     INITIALIZE UIEDITOR
     ========================================================= */

  async function initEditor() {

    try {

      clearError();

      setStatus(
        "Authenticating with Stripo..."
      );


      /*
       * Load Stripo UIEditor module.
       */

      await import(
        "https://plugins.stripo.email/resources/uieditor/latest/UIEditor.js"
      );


      if (
        !window.UIEditor ||
        typeof window.UIEditor.initEditor !==
          "function"
      ) {

        throw new Error(
          "Stripo UIEditor was not loaded."
        );

      }


      const template =
        getInitialTemplate();


      currentHtml =
        template.html;

      currentCss =
        template.css;


      /*
       * Initial authentication.
       */

      const token =
        await getValidStripoToken();


      setStatus(
        "Starting Stripo editor..."
      );


      /*
       * Stripo editor configuration.
       *
       * These are client-side features/configuration.
       * Paid-only server functionality is deliberately
       * not faked/enabled here.
       */

      const config = {

        /* ---------------------------------------------------
           AMP
           --------------------------------------------------- */

        ampPage: true,

        ignoreAmp: false,


        /* ---------------------------------------------------
           BRAND COLORS
           --------------------------------------------------- */

        brandColorPalette: [

          "#111827",
          "#2563eb",
          "#7c3aed",
          "#db2777",
          "#dc2626",
          "#ea580c",
          "#ca8a04",
          "#16a34a",
          "#0891b2",

          "#000000",
          "#ffffff",
          "#f3f4f6",
          "#e5e7eb",
          "#9ca3af"

        ],


        /* ---------------------------------------------------
           CUSTOM FONT SIZES
           ---------------------------------------------------

           Stripo documents custom font sizes as available
           on Free.
        */

        editorFontSizes: {

          showDefaultStandardFontsSizes: true,

          showDefaultNotStandardFontsSizes: true,

          customFontsSizes: [
            10,
            11,
            12,
            13,
            14,
            15,
            16,
            17,
            18,
            20,
            22,
            24,
            26,
            28,
            30,
            32,
            36,
            40,
            44,
            48,
            52,
            56,
            60
          ]

        },


        /* ---------------------------------------------------
           INITIAL TEMPLATE
           --------------------------------------------------- */

        html:
          currentHtml,

        css:
          currentCss,


        /* ---------------------------------------------------
           METADATA
           --------------------------------------------------- */

        metadata: {

          emailId:
            "demo-email-1",

          userId:
            STRIPO_CONFIG.userId,

          role:
            STRIPO_CONFIG.role

        },


        /* ---------------------------------------------------
           LOCALE
           --------------------------------------------------- */

        locale: "en",


        /* ---------------------------------------------------
           COMMENTING
           --------------------------------------------------- */

        commentingEnabled: false,


        /* ---------------------------------------------------
           MODULE STYLES
           --------------------------------------------------- */

        keepModuleStylesEnabled: true,


        /* ---------------------------------------------------
           AUTH TOKEN
           ---------------------------------------------------

           Called by Stripo whenever it needs a fresh token.
        */

        onTokenRefreshRequest:
          async function(callback) {

            try {

              const freshToken =
                await requestStripoToken();

              callback(freshToken);

            } catch (error) {

              console.error(
                "Token refresh error:",
                error
              );

              showError(
                error.message ||
                "Unable to refresh Stripo token."
              );

            }

          },


        /* ---------------------------------------------------
           USER LIST
           --------------------------------------------------- */

        onUserListChange:
          function(users) {

            console.log(
              "Stripo user list:",
              users
            );

          },


        /* ---------------------------------------------------
           NOTIFICATIONS
           --------------------------------------------------- */

        notifications: {

          success: function(message) {

            console.log(
              "Stripo success:",
              message
            );

          },

          error: function(message) {

            console.error(
              "Stripo error:",
              message
            );

          },

          warning: function(message) {

            console.warn(
              "Stripo warning:",
              message
            );

          },

          info: function(message) {

            console.info(
              "Stripo info:",
              message
            );

          }

        }

      };


      /*
       * ------------------------------------------------------
       * INIT EDITOR
       * ------------------------------------------------------
       */

      stripoEditor =
        await window.UIEditor.initEditor(
          document.getElementById(
            "stripo-editor"
          ),
          config
        );


      editorReady = true;


      loadingElement.classList.add(
        "hidden"
      );


      setStatus(
        "Stripo editor ready"
      );


      console.log(
        "Stripo editor initialized:",
        stripoEditor
      );


    } catch (error) {

      loadingElement.classList.add(
        "hidden"
      );

      showError(
        error.stack ||
        error.message ||
        String(error)
      );

    }

  }


  /* =========================================================
     STRIPO API ACCESS
     ========================================================= */

  function getEditorApi() {

    if (!editorReady) {

      throw new Error(
        "Stripo editor is not ready."
      );

    }


    /*
     * Depending on the currently loaded UIEditor version,
     * Stripo exposes the editor API through the editor object.
     */

    if (
      stripoEditor &&
      stripoEditor.actionsApi
    ) {

      return stripoEditor.actionsApi;

    }


    if (
      window.StripoEditorApi &&
      window.StripoEditorApi.actionsApi
    ) {

      return window.StripoEditorApi.actionsApi;

    }


    return null;

  }


  /* =========================================================
     GET TEMPLATE
     ========================================================= */

  async function getTemplateData() {

    const api =
      getEditorApi();


    if (
      api &&
      typeof api.getTemplateData ===
        "function"
    ) {

      return await api.getTemplateData();

    }


    /*
     * Legacy fallback.
     */

    if (
      window.StripoApi &&
      typeof window.StripoApi.getTemplate ===
        "function"
    ) {

      return await new Promise(
        (resolve, reject) => {

          try {

            window.StripoApi.getTemplate(
              function(html, css) {

                resolve({
                  html: html || "",
                  css: css || ""
                });

              }
            );

          } catch (error) {

            reject(error);

          }

        }
      );

    }


    throw new Error(
      "Stripo getTemplate API is not available."
    );

  }


  /* =========================================================
     SAVE
     ========================================================= */

  async function saveTemplate() {

    try {

      clearError();

      setStatus(
        "Reading template..."
      );


      const template =
        await getTemplateData();


      currentHtml =
        template.html ||
        template.content ||
        "";


      currentCss =
        template.css ||
        "";


      /*
       * IMPORTANT:
       *
       * This saves the generated template locally.
       *
       * Stripo's paid AutoSaving/server persistence
       * is NOT being falsely enabled.
       */

      const savedTemplate = {

        html:
          currentHtml,

        css:
          currentCss,

        savedAt:
          new Date().toISOString(),

        userId:
          STRIPO_CONFIG.userId

      };


      localStorage.setItem(
        "stripo-free-template",
        JSON.stringify(
          savedTemplate
        )
      );


      setStatus(
        "Template saved locally"
      );


      console.log(
        "Saved template:",
        savedTemplate
      );


    } catch (error) {

      showError(
        error.message ||
        String(error)
      );

    }

  }


  /* =========================================================
     COMPILE EMAIL
     ========================================================= */

  async function compileEmail() {

    try {

      clearError();

      setStatus(
        "Compiling email..."
      );


      const api =
        getEditorApi();


      if (
        api &&
        typeof api.compileEmail ===
          "function"
      ) {

        const result =
          await api.compileEmail();


        console.log(
          "Compiled email:",
          result
        );


        if (
          typeof result === "string"
        ) {

          openCodeModal(result);

        } else {

          openCodeModal(
            result.html ||
            result.content ||
            ""
          );

        }


        setStatus(
          "Email compiled"
        );

        return;

      }


      /*
       * Fallback: return current template.
       */

      const template =
        await getTemplateData();


      openCodeModal(
        template.html || ""
      );


      setStatus(
        "Template HTML displayed"
      );


    } catch (error) {

      showError(
        error.message ||
        String(error)
      );

    }

  }


  /* =========================================================
     SHOW HTML
     ========================================================= */

  async function showTemplateHtml() {

    try {

      clearError();

      const template =
        await getTemplateData();


      currentHtml =
        template.html || "";


      currentCss =
        template.css || "";


      openCodeModal(
        currentHtml
      );


    } catch (error) {

      showError(
        error.message ||
        String(error)
      );

    }

  }


  function openCodeModal(html) {

    htmlOutput.value =
      html || "";

    codeModal.classList.add(
      "visible"
    );

  }


  function closeCodeModal() {

    codeModal.classList.remove(
      "visible"
    );

  }


  /* =========================================================
     UNDO / REDO
     ========================================================= */

  async function undo() {

    try {

      const api =
        getEditorApi();


      if (
        api &&
        typeof api.undo ===
          "function"
      ) {

        await api.undo();

        return;

      }


      if (
        window.StripoApi &&
        typeof window.StripoApi.undo ===
          "function"
      ) {

        window.StripoApi.undo();

        return;

      }


      console.warn(
        "Undo API is not exposed by this UIEditor build."
      );

    } catch (error) {

      showError(
        error.message ||
        String(error)
      );

    }

  }


  async function redo() {

    try {

      const api =
        getEditorApi();


      if (
        api &&
        typeof api.redo ===
          "function"
      ) {

        await api.redo();

        return;

      }


      if (
        window.StripoApi &&
        typeof window.StripoApi.redo ===
          "function"
      ) {

        window.StripoApi.redo();

        return;

      }


      console.warn(
        "Redo API is not exposed by this UIEditor build."
      );

    } catch (error) {

      showError(
        error.message ||
        String(error)
      );

    }

  }


  /* =========================================================
     DEVICE VIEW
     ========================================================= */

  function setDesktopView() {

    document
      .getElementById("desktopButton")
      .classList.add("active");

    document
      .getElementById("mobileButton")
      .classList.remove("active");


    try {

      if (
        stripoEditor &&
        stripoEditor.previewApi &&
        typeof
          stripoEditor.previewApi.switchToDesktopPreview ===
          "function"
      ) {

        stripoEditor
          .previewApi
          .switchToDesktopPreview();

      }

    } catch (error) {

      console.warn(
        "Desktop preview API unavailable:",
        error
      );

    }

  }


  function setMobileView() {

    document
      .getElementById("mobileButton")
      .classList.add("active");

    document
      .getElementById("desktopButton")
      .classList.remove("active");


    try {

      if (
        stripoEditor &&
        stripoEditor.previewApi &&
        typeof
          stripoEditor.previewApi.switchToMobilePreview ===
          "function"
      ) {

        stripoEditor
          .previewApi
          .switchToMobilePreview();

      }

    } catch (error) {

      console.warn(
        "Mobile preview API unavailable:",
        error
      );

    }

  }


  /* =========================================================
     BUTTON EVENTS
     ========================================================= */

  document
    .getElementById("undoButton")
    .addEventListener(
      "click",
      undo
    );


  document
    .getElementById("redoButton")
    .addEventListener(
      "click",
      redo
    );


  document
    .getElementById("desktopButton")
    .addEventListener(
      "click",
      setDesktopView
    );


  document
    .getElementById("mobileButton")
    .addEventListener(
      "click",
      setMobileView
    );


  document
    .getElementById("saveButton")
    .addEventListener(
      "click",
      saveTemplate
    );


  document
    .getElementById("getTemplateButton")
    .addEventListener(
      "click",
      showTemplateHtml
    );


  document
    .getElementById("compileButton")
    .addEventListener(
      "click",
      compileEmail
    );


  document
    .getElementById("codeButton")
    .addEventListener(
      "click",
      showTemplateHtml
    );


  document
    .getElementById("closeCodeButton")
    .addEventListener(
      "click",
      closeCodeModal
    );


  codeModal.addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        codeModal
      ) {

        closeCodeModal();

      }

    }
  );


  /* =========================================================
     LOCAL TEMPLATE RESTORE
     ========================================================= */

  function restoreLocalTemplate() {

    try {

      const raw =
        localStorage.getItem(
          "stripo-free-template"
        );


      if (!raw) {

        return null;

      }


      const saved =
        JSON.parse(raw);


      if (
        !saved ||
        typeof saved.html !==
          "string"
      ) {

        return null;

      }


      return saved;

    } catch (error) {

      console.warn(
        "Could not restore local template:",
        error
      );

      return null;

    }
